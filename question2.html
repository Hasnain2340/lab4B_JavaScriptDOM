<!DOCTYPE html>
<html>
    <head>
        <title> Question 2</title>
    </head>

    <body>
        <h2>Number checking</h2>

        <input type="text" id="userInput" placeholder="Enter a number">

        <button onclick="checkInput()">check</button>

        <script>
            function checkInput(){
                let number = document.getElementById("userInput").value;

                if(number.trim()=="" || isNaN(number)){
                    alert("please insert a number");

                }
                else if(Number(number) < 10){
                    alert ("number is lower than 10");
                }
                else{
                    alert("number is greater than 10");
                }
            }
        </script>
    </body>
</html>
